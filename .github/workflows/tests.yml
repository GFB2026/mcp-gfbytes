name: tests

on:
  push:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnose unit tests
        working-directory: diagnose
        run: |
          python -m pip install "pytest>=8"
          python -m pytest tests/
